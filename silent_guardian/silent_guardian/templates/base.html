<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Silent Guardian{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="brand" href="{{ url_for('index') }}">🛡️ Silent&nbsp;Guardian</a>
      <div class="nav-links">
        <a href="{{ url_for('index') }}">Detect</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('export_incidents') }}">Export CSV</a>
      </div>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>Silent Guardian — AI-Based Violence Detection and Smart Alert System</p>
  </footer>
</body>
</html>
